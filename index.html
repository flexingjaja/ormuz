<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ORMUZ</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#059669">
    <link rel="apple-touch-icon" href="favicon.png">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ORMUZ">
    
    <link rel="icon" type="image/png" href="favicon.png">
    
    <!-- CSS Leaflet & MarkerCluster -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');

        :root {
            --bg-body: #f8fafc;
            --bg-sidebar: #ffffff;
            --bg-card: #ffffff;
            --bg-card-hover: #f1f5f9;
            --border-color: #e2e8f0;
            --accent: #059669;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --input-bg: #f8fafc;
            --btn-bg: #f1f5f9;
            --handle-color: #cbd5e1;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        body.dark-mode {
            --bg-body: #09090b;
            --bg-sidebar: #121214;
            --bg-card: #1c1c1f;
            --bg-card-hover: #27272a;
            --border-color: #27272a;
            --accent: #10b981;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --input-bg: #09090b;
            --btn-bg: #27272a;
            --handle-color: #3f3f46;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { display: flex; height: 100vh; width: 100vw; background-color: var(--bg-body); color: var(--text-main); overflow: hidden; transition: background-color 0.3s, color 0.3s; -webkit-user-select: none; user-select: none; }
        a { text-decoration: none; }
        input[type="text"] { -webkit-user-select: auto; user-select: auto; }

        body.dark-mode .leaflet-layer, body.dark-mode .leaflet-control-zoom-in, body.dark-mode .leaflet-control-zoom-out, body.dark-mode .leaflet-control-attribution { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); transition: filter 0.3s ease; }

        .sidebar { width: 420px; height: 100vh; background: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 1000; box-shadow: 2px 0 20px rgba(0,0,0,0.08); position: relative; }
        .sheet-handle { display: none; }
        .map-container { flex: 1; height: 100vh; position: relative; }
        #map { width: 100%; height: 100%; z-index: 1; background: var(--bg-body); cursor: crosshair; }

        .header { padding: 20px 20px 15px 20px; border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
        .brand-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .logo { font-size: 1.6rem; font-weight: 900; letter-spacing: -1px; }
        .logo span { color: var(--accent); }
        .theme-btn { background: var(--btn-bg); color: var(--text-main); border: 1px solid var(--border-color); font-size: 1.2rem; cursor: pointer; width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .theme-btn:active { transform: scale(0.95); }

        .search-wrapper { display: flex; gap: 8px; margin-bottom: 15px; }
        .btn-icon { background: var(--btn-bg); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 12px; width: 44px; height: 44px; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 1.2rem; transition: 0.2s; flex-shrink: 0; touch-action: manipulation; }
        .btn-icon:active { filter: brightness(0.9); transform: scale(0.95); }
        input[type="text"] { flex: 1; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 0 15px; color: var(--text-main); font-size: 1rem; outline: none; transition: border-color 0.2s; min-width: 0; }
        input[type="text"]:focus { border-color: var(--accent); }
        .btn-submit { background: var(--accent); color: white; border: none; border-radius: 12px; padding: 0 16px; font-weight: 600; cursor: pointer; transition: 0.2s; height: 44px; flex-shrink: 0; touch-action: manipulation; }
        .btn-submit:active { transform: scale(0.95); }

        .sliders-container { display: flex; gap: 15px; margin-bottom: 15px; }
        .slider-box { flex: 1; }
        .slider-label { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
        .slider-label span:last-child { color: var(--accent); font-weight: 700; }
        input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; height: 6px; border-radius: 5px; }

        .filters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 5px; }
        .filter-chip { background: var(--btn-bg); border: 1px solid transparent; color: var(--text-muted); padding: 10px 0; border-radius: 12px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s; text-align: center; touch-action: manipulation; }
        .filter-chip.active { background: var(--text-main); color: var(--bg-body); }
        .filter-chip:active { transform: scale(0.96); }

        /* --- TRI INTELLIGENT --- */
        .list-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px 0 20px; flex-shrink: 0; }
        .list-count { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); }
        .sort-select { background: var(--btn-bg); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 10px; padding: 6px 10px; font-size: 0.85rem; font-weight: 600; outline: none; cursor: pointer; }

        .results-scroll { flex: 1; overflow-y: auto; padding: 15px 20px; display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; }
        .results-scroll::-webkit-scrollbar { width: 6px; }
        .results-scroll::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
        .status-msg { text-align: center; color: var(--text-muted); padding: 20px 0; font-size: 0.95rem; font-weight: 500; }

        .station-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 16px; transition: all 0.2s; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .station-card:active { background: var(--bg-card-hover); transform: scale(0.98); }

        .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .station-info { flex: 1; min-width: 0; }
        .station-brand { font-size: 1.1rem; font-weight: 800; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; }
        .station-dist { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); background: var(--btn-bg); padding: 2px 6px; border-radius: 6px; }
        .station-addr { font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 4px; }

        .price-info { text-align: right; flex-shrink: 0; }
        .price-val { font-size: 1.5rem; font-weight: 900; color: var(--text-main); letter-spacing: -1px; line-height: 1; }
        .price-type { font-size: 0.75rem; color: var(--text-muted); font-weight: 700; margin-top: 2px; display: block; }
        .total-badge { background: rgba(5, 150, 105, 0.1); color: var(--accent); padding: 4px 8px; border-radius: 8px; font-size: 0.85rem; font-weight: 800; margin-top: 8px; display: inline-block; }
        body.dark-mode .total-badge { background: rgba(16, 185, 129, 0.15); }

        /* --- TENDANCES (HISTORIQUE) --- */
        .trend-badge { display: inline-block; font-size: 0.75rem; font-weight: 700; padding: 3px 6px; border-radius: 6px; margin-top: 6px; }
        .trend-down { background: rgba(16, 185, 129, 0.15); color: #10b981; }
        .trend-up { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
        .trend-flat { background: var(--btn-bg); color: var(--text-muted); }

        .card-actions, .popup-actions { display: flex; gap: 8px; margin-top: 15px; }
        .action-btn { flex: 1; display: flex; justify-content: center; align-items: center; gap: 6px; background: var(--btn-bg); color: var(--text-main) !important; border: none; border-radius: 10px; padding: 10px 0; font-size: 0.8rem; font-weight: 600; transition: 0.2s; cursor: pointer; touch-action: manipulation; }
        .action-btn:active { filter: brightness(0.9); transform: scale(0.96); }
        body.dark-mode .action-btn:active { filter: brightness(1.2); }

        .map-price-marker { background: var(--bg-card); color: var(--text-main); padding: 6px 10px; border-radius: 10px; font-weight: 800; font-size: 14px; border: 2px solid var(--border-color); box-shadow: 0 4px 15px rgba(0,0,0,0.1); white-space: nowrap; line-height: 1.2; transition: transform 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 60px; }
        body.dark-mode .map-price-marker { box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .map-price-marker::after { content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); border-width: 6px 6px 0; border-style: solid; border-color: var(--border-color) transparent transparent transparent; }
        .map-price-marker.cheapest { background: var(--accent); color: white; border-color: var(--accent); transform: scale(1.1); z-index: 1000 !important; }
        .map-price-marker.cheapest::after { border-top-color: var(--accent); }
        .marker-total { font-size: 0.75rem; font-weight: 600; opacity: 0.9; margin-top: 2px; }

        /* --- CLUSTERS CSS --- */
        .marker-cluster { background-color: rgba(5, 150, 105, 0.6); }
        .marker-cluster div { background-color: var(--accent); color: white; font-family: 'Inter', sans-serif; font-weight: bold; border: 2px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        body.dark-mode .marker-cluster div { border-color: var(--bg-body); }

        .leaflet-popup-content-wrapper { background: var(--bg-card); color: var(--text-main); border-radius: 16px; padding: 5px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
        .leaflet-popup-tip { background: var(--bg-card); }
        .popup-title { font-weight: 900; margin-bottom: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; font-size: 1.1rem; }
        .popup-row { display: flex; justify-content: space-between; align-items: center; gap: 20px; font-size: 0.9rem; margin-bottom: 10px; }
        .popup-fuel { font-weight: 600; color: var(--text-muted); }
        .popup-price-group { text-align: right; }
        .popup-price { font-weight: 800; color: var(--text-main); display: block; }
        .popup-total { font-size: 0.75rem; color: var(--accent); font-weight: 700; }
        .leaflet-container a.leaflet-popup-close-button { color: var(--text-muted); top: 10px; right: 10px; }

        .footer-links { text-align: center; padding: 12px; padding-bottom: calc(12px + var(--safe-bottom)); border-top: 1px solid var(--border-color); font-size: 0.8rem; flex-shrink: 0; }
        .footer-links a { color: var(--text-muted); text-decoration: underline; margin: 0 5px; }

        @media (max-width: 768px) {
            body { flex-direction: column; height: 100dvh; } 
            .map-container { height: 40dvh; order: 1; z-index: 1; flex: none; }
            .sidebar { width: 100%; height: 65dvh; order: 2; border-right: none; border-top: 1px solid rgba(0,0,0,0.05); box-shadow: 0 -10px 25px rgba(0,0,0,0.1); border-radius: 24px 24px 0 0; margin-top: -5dvh; padding-top: 10px; }
            body.dark-mode .sidebar { box-shadow: 0 -10px 25px rgba(0,0,0,0.5); border-top: 1px solid rgba(255,255,255,0.05); }
            .sheet-handle { display: block; width: 40px; height: 5px; background: var(--handle-color); border-radius: 5px; margin: 0 auto 10px auto; }
            .header { padding: 5px 15px 15px 15px; border-bottom: none; }
            .brand-row { margin-bottom: 12px; }
            .logo { font-size: 1.4rem; }
            .filters { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 8px; padding-bottom: 15px; margin-bottom: 0; -ms-overflow-style: none; scrollbar-width: none; border-bottom: 1px solid var(--border-color); }
            .filters::-webkit-scrollbar { display: none; }
            .filter-chip { flex: 0 0 auto; scroll-snap-align: start; padding: 8px 16px; border-radius: 20px; font-size: 0.8rem; }
            .search-wrapper { margin-bottom: 15px; }
            .sliders-container { margin-bottom: 0; padding-top: 10px; }
            .list-header { padding: 5px 15px 0 15px; }
            .results-scroll { padding: 15px; padding-bottom: calc(20px + var(--safe-bottom)); }
            .leaflet-control-zoom { display: none; } 
        }
    </style>
</head>
<body>

    <main class="map-container">
        <div id="map"></div>
    </main>

    <aside class="sidebar">
        <div class="sheet-handle"></div>

        <div class="header">
            <div class="brand-row">
                <div class="logo">ORMUZ</span></div>
                <button class="theme-btn" onclick="toggleTheme()" id="theme-btn" title="Changer le thème">🌙</button>
            </div>

            <div class="search-wrapper">
                <button class="btn-icon" onclick="locateMe()" title="Autour de moi">📍</button>
                <input type="text" id="cp" placeholder="Code postal (ex: 76000)" maxlength="5" inputmode="numeric">
                <button class="btn-submit" onclick="searchByCP()">Chercher</button>
            </div>

            <div class="filters">
                <button class="filter-chip active" data-key="gazole_prix">Gazole</button>
                <button class="filter-chip active" data-key="e10_prix">E10</button>
                <button class="filter-chip active" data-key="sp95_prix">SP95</button>
                <button class="filter-chip active" data-key="sp98_prix">SP98</button>
                <button class="filter-chip" data-key="e85_prix">E85</button>
                <button class="filter-chip" data-key="gplc_prix">GPLc</button>
            </div>

            <div class="sliders-container">
                <div class="slider-box">
                    <div class="slider-label"><span>Rayon</span><span id="dist-val">10 km</span></div>
                    <input type="range" id="radius" min="1" max="50" value="10" oninput="updateDist(this.value)" onchange="triggerMapFetch()">
                </div>
                <div class="slider-box">
                    <div class="slider-label"><span>Mon plein</span><span id="liters-val">50 L</span></div>
                    <input type="range" id="liters" min="5" max="100" value="50" oninput="updateLiters(this.value)">
                </div>
            </div>
        </div>

        <!-- TRI INTELLIGENT -->
        <div class="list-header" id="list-header" style="display: none;">
            <div class="list-count" id="list-count">0 station</div>
            <select id="sort-by" class="sort-select" onchange="renderUI()">
                <option value="price">💰 Le moins cher</option>
                <option value="distance">📍 Le plus proche</option>
            </select>
        </div>

        <div class="results-scroll" id="results">
            <div class="status-msg">Déplacez la carte ou tapez un code postal pour voir les prix.</div>
        </div>
    </aside>

    <!-- SCRIPTS Leaflet & MarkerCluster -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(err => console.log('SW err:', err)); });
        }

        const map = L.map('map', { zoomControl: false, tap: false }).setView([49.4432, 1.0999], 12);
        
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap', maxZoom: 19
        }).addTo(map);
        
        L.control.zoom({ position: 'topright' }).addTo(map);
        
        // Initialisation de MarkerCluster (IDÉE 3)
        const markersGroup = L.markerClusterGroup({
            maxClusterRadius: 40,
            showCoverageOnHover: false,
            zoomToBoundsOnClick: true
        }).addTo(map);

        window.addEventListener('resize', () => map.invalidateSize());
        
        document.getElementById('cp').addEventListener('keypress', e => { 
            if (e.key === 'Enter') { document.getElementById('cp').blur(); searchByCP(); }
        });

        let currentStationsData = []; 
        let blockMapEvent = false; 
        let mapMoveTimeout; 

        // Chargement de l'historique des prix (IDÉE 10)
        let priceHistory = JSON.parse(localStorage.getItem('enreserve_history') || '{}');

        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('enreserve_theme') === 'dark' || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches && !localStorage.getItem('enreserve_theme'))) {
                document.body.classList.add('dark-mode');
                document.getElementById('theme-btn').innerText = '☀️';
            }
        });

        map.on('moveend', () => {
            if (blockMapEvent) { blockMapEvent = false; return; }
            clearTimeout(mapMoveTimeout);
            mapMoveTimeout = setTimeout(() => { triggerMapFetch(); }, 600);
        });

        function triggerMapFetch() {
            const center = map.getCenter();
            fetchStations(center.lat, center.lng);
        }

        function updateDist(v) { document.getElementById('dist-val').innerText = v + " km"; }
        function updateLiters(v) { 
            document.getElementById('liters-val').innerText = v + " L"; 
            if(currentStationsData.length > 0) renderUI(); 
        }
        
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('theme-btn').innerText = isDark ? '☀️' : '🌙';
            localStorage.setItem('enreserve_theme', isDark ? 'dark' : 'light');
        }

        document.querySelectorAll('.filter-chip').forEach(btn => {
            btn.onclick = function() {
                this.classList.toggle('active');
                if(currentStationsData.length > 0) renderUI(); 
            };
        });

        const fuelMap = { 'gazole_prix': 'Gazole', 'e10_prix': 'E10', 'sp95_prix': 'SP95', 'sp98_prix': 'SP98', 'e85_prix': 'E85', 'gplc_prix': 'GPLc' };
        const formatT = (t) => t ? t.toLowerCase().replace(/(^\w|\s\w)/g, m => m.toUpperCase()) : '';

        function getCleanBrand(s) {
            let name = (s.nom || "").toUpperCase().trim();
            let addr = (s.adresse || "").toUpperCase().trim();
            const brands = ["TOTAL", "CARREFOUR", "LECLERC", "INTERMARCHE", "ESSO", "BP", "AUCHAN", "CASINO", "SYSTEME U", "AVIA", "SHELL", "ENI", "CORA", "SUPER U"];
            for (let b of brands) { if (name.includes(b) || addr.includes(b)) return b; }
            if (name === addr || name === "" || name.includes("RUE") || name.includes("AVENUE") || name.includes("ROUTE") || name.includes("Z.A")) return "Station"; 
            return formatT(s.nom);
        }

        function formatDistance(meters) {
            return meters < 1000 ? Math.round(meters) + ' m' : (meters / 1000).toFixed(1) + ' km';
        }

        function shareStation(btn) {
            const brand = btn.getAttribute('data-brand');
            const type = btn.getAttribute('data-type');
            const price = btn.getAttribute('data-price');
            const city = btn.getAttribute('data-city');
            const shareText = `🚗 Bon plan carburant ! Le ${type} est à ${price}€/L chez ${brand} (${city}).`;
            if (navigator.share) navigator.share({ title: 'EnRéserve.fr', text: shareText, url: 'https://enreserve.fr' }).catch(console.error);
            else alert("Copiez ce texte :\n\n" + shareText + "\nhttps://enreserve.fr");
        }

        function setMapViewOffset(lat, lon, zoom = 14) {
            blockMapEvent = true;
            const offsetLat = window.innerWidth <= 768 ? lat - 0.015 : lat; 
            map.setView([offsetLat, lon], zoom, { animate: true });
        }

        async function searchByCP() {
            const cp = document.getElementById('cp').value.trim();
            const resDiv = document.getElementById('results');
            document.getElementById('cp').blur(); 
            if (!/^\d{5}$/.test(cp)) { resDiv.innerHTML = '<div class="status-msg">Code postal invalide.</div>'; return; }
            resDiv.innerHTML = '<div class="status-msg">Recherche de la ville...</div>';
            try {
                const geo = await fetch(`https://api-adresse.data.gouv.fr/search/?q=${cp}&type=municipality&limit=1`).then(r => r.json());
                if (!geo.features.length) throw new Error("Introuvable.");
                const [lon, lat] = geo.features[0].geometry.coordinates;
                setMapViewOffset(lat, lon, 13);
                fetchStations(lat, lon);
            } catch (e) { resDiv.innerHTML = `<div class="status-msg">Erreur: ${e.message}</div>`; }
        }

        function locateMe() {
            if (!navigator.geolocation) return alert("Géolocalisation non supportée.");
            document.getElementById('results').innerHTML = '<div class="status-msg">Recherche de votre position...</div>';
            navigator.geolocation.getCurrentPosition(
                pos => {
                    document.getElementById('cp').value = "";
                    setMapViewOffset(pos.coords.latitude, pos.coords.longitude, 13);
                    fetchStations(pos.coords.latitude, pos.coords.longitude);
                },
                err => { document.getElementById('results').innerHTML = '<div class="status-msg">Géolocalisation refusée.</div>'; },
                { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
            );
        }

        async function fetchStations(lat, lon) {
            const radius = document.getElementById('radius').value;
            const resDiv = document.getElementById('results');
            document.getElementById('list-header').style.display = 'none';

            resDiv.innerHTML = '<div class="status-msg">Analyse des pompes dans cette zone...</div>';
            markersGroup.clearLayers();

            try {
                const data = await fetch(`https://data.economie.gouv.fr/api/explore/v2.1/catalog/datasets/prix-des-carburants-en-france-flux-instantane-v2/records?where=within_distance(geom, geom'POINT(${lon} ${lat})', ${radius}km)&limit=80`).then(r => r.json());
                currentStationsData = data.results; 
                renderUI(); 
            } catch (e) { resDiv.innerHTML = `<div class="status-msg">Erreur réseau.</div>`; }
        }

        function renderUI() {
            const resDiv = document.getElementById('results');
            const activeFuels = Array.from(document.querySelectorAll('.filter-chip.active')).map(b => b.dataset.key);
            const volume = parseFloat(document.getElementById('liters').value);
            const sortBy = document.getElementById('sort-by').value;
            const mapCenter = map.getCenter();

            markersGroup.clearLayers();

            if (activeFuels.length === 0) {
                resDiv.innerHTML = '<div class="status-msg">Sélectionnez un carburant.</div>';
                document.getElementById('list-header').style.display = 'none';
                return;
            }

            let stations = currentStationsData.map(s => {
                if (!s.geom) return null;
                let allPrices = [];
                Object.keys(fuelMap).forEach(k => { if(s[k]) allPrices.push({ label: fuelMap[k], price: parseFloat(s[k]) }); });
                
                let bestP = Infinity, bestT = '';
                activeFuels.forEach(k => { if(s[k] && parseFloat(s[k]) < bestP) { bestP = parseFloat(s[k]); bestT = fuelMap[k]; } });
                if (bestP === Infinity) return null;

                // Calcul distance
                const distanceMeters = mapCenter.distanceTo([s.geom.lat, s.geom.lon]);

                // Historique et Tendance (IDÉE 10)
                const histKey = `${s.id}_${bestT}`;
                const oldPrice = priceHistory[histKey];
                let trendHtml = '';
                if (oldPrice) {
                    if (bestP < oldPrice) trendHtml = `<span class="trend-badge trend-down">↘ -${(oldPrice - bestP).toFixed(3)}€</span>`;
                    else if (bestP > oldPrice) trendHtml = `<span class="trend-badge trend-up">↗ +${(bestP - oldPrice).toFixed(3)}€</span>`;
                    else trendHtml = `<span class="trend-badge trend-flat">→ =</span>`;
                } else {
                    trendHtml = `<span class="trend-badge trend-flat">Nouveau</span>`;
                }
                
                // Sauvegarde du nouveau prix en mémoire
                priceHistory[histKey] = bestP;

                return {
                    id: s.id, brand: getCleanBrand(s), addr: formatT(s.adresse), city: formatT(s.ville),
                    price: bestP, type: bestT, allPrices: allPrices, lat: s.geom.lat, lon: s.geom.lon,
                    distance: distanceMeters, trend: trendHtml
                };
            }).filter(x => x);

            // Sauvegarde de l'historique dans le téléphone
            localStorage.setItem('enreserve_history', JSON.stringify(priceHistory));

            if (stations.length === 0) {
                resDiv.innerHTML = '<div class="status-msg">Aucune station trouvée.</div>';
                document.getElementById('list-header').style.display = 'none';
                return;
            }

            // Identification de la moins chère (pour le style) AVANT LE TRI !
            const cheapestPrice = Math.min(...stations.map(s => s.price));

            // TRI INTELLIGENT (IDÉE 1)
            if (sortBy === 'distance') {
                stations.sort((a, b) => a.distance - b.distance);
            } else {
                stations.sort((a, b) => a.price - b.price);
            }

            document.getElementById('list-header').style.display = 'flex';
            document.getElementById('list-count').innerText = `${stations.length} station${stations.length > 1 ? 's' : ''}`;
            resDiv.innerHTML = '';
            
            stations.slice(0, 30).forEach((s) => {
                const isCheapest = (s.price === cheapestPrice);
                const totalEuro = (s.price * volume).toFixed(2);
                const mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lon}`;
                const wazeUrl = `https://waze.com/ul?ll=${s.lat},${s.lon}&navigate=yes`;
                
                const card = document.createElement('div');
                card.className = 'station-card';
                card.innerHTML = `
                    <div class="card-top" onclick="setMapViewOffset(${s.lat}, ${s.lon}, 16)">
                        <div class="station-info">
                            <div class="station-brand">${s.brand} <span class="station-dist">${formatDistance(s.distance)}</span></div>
                            <div class="station-addr">${s.addr}<br>${s.city}</div>
                            ${s.trend}
                        </div>
                        <div class="price-info">
                            <div class="price-val">${s.price.toFixed(3)}</div>
                            <span class="price-type">${s.type}</span>
                            <div class="total-badge">${totalEuro} €</div>
                        </div>
                    </div>
                    <div class="card-actions">
                        <a class="action-btn" href="${mapsUrl}" target="_blank">🗺️ Maps</a>
                        <a class="action-btn" href="${wazeUrl}" target="_blank">🚗 Waze</a>
                        <button class="action-btn" data-brand="${s.brand}" data-type="${s.type}" data-price="${s.price.toFixed(3)}" data-city="${s.city}" onclick="shareStation(this)">📤 Partager</button>
                    </div>
                `;
                resDiv.appendChild(card);

                let popupHTML = `<div class="popup-title">${s.brand}</div>`;
                s.allPrices.forEach(p => { 
                    const pTotal = (p.price * volume).toFixed(2);
                    popupHTML += `<div class="popup-row"><span class="popup-fuel">${p.label}</span><div class="popup-price-group"><span class="popup-price">${p.price.toFixed(3)}€ /L</span><span class="popup-total">${pTotal}€ au total</span></div></div>`; 
                });
                popupHTML += `<div class="popup-actions" style="margin-top:12px; border-top:1px solid var(--border-color); padding-top:12px;"><a class="action-btn" href="${wazeUrl}" target="_blank" style="padding: 8px 0; font-size: 0.85rem;">Aller avec Waze</a></div>`;

                const iconHTML = `<div class="map-price-marker ${isCheapest ? 'cheapest' : ''}">${s.price.toFixed(3)}€<div class="marker-total">${totalEuro}€</div></div>`;
                const customIcon = L.divIcon({ className: '', html: iconHTML, iconSize: [60, 40], iconAnchor: [30, 46] });
                
                // Ajout au CLUSTER au lieu de map (IDÉE 3)
                L.marker([s.lat, s.lon], { icon: customIcon }).bindPopup(popupHTML).addTo(markersGroup);
            });
            
            const footer = document.createElement('div');
            footer.className = 'footer-links';
            footer.innerHTML = '<a href="mentions.html">À propos & Mentions légales</a>';
            resDiv.appendChild(footer);
        }

        setTimeout(() => { triggerMapFetch(); }, 500);
    </script>
</body>
</html>
